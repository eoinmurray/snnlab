[project]
name = "snnlab"
dynamic = ["version"]
description = "Author, simulate and visualise spiking neural networks with conductance-based and current-based dynamics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eoin Murray" }]
dependencies = ["numpy>=2.2.6", "scipy>=1.15.3", "torch>=2.10.0", "torchvision>=0.25.0", "matplotlib>=3.10.8", "scikit-learn>=1.7.2", "h5py>=3.16.0"]

[project.urls]
Repository = "https://github.com/eoinmurray/snnlab"

[project.scripts]
snnsim = "snnlab.sim.tool:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snnlab"]

[tool.hatch.version]
path = "src/snnlab/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/examples/analysis", "/examples/current-lif", "/examples/neurons", "/examples/quickstart", "/examples/training", "/examples/inference", "/examples/pytorch", "/examples/customisation", "/src", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]
exclude = ["/examples/customisation/network.bundle", "/examples/pytorch/trained.pt", "/examples/pytorch/metrics.json", "/examples/inference/predictions.json", "/examples/training/network.bundle", "/examples/training/trained.checkpoint", "/examples/training/metrics.json", "/docs/node_modules", "/docs/.next", "/docs/.source", "/docs/.astro", "/docs/out", "/docs/.wrangler", "/docs/.env*", "/docs/next-env.d.ts", "**/__pycache__", "**/*.pyc", "**/*.tsbuildinfo", "**/.DS_Store"]

[dependency-groups]
dev = ["pytest>=9.0.1", "pytest-cov>=7.1.0", "ruff>=0.15.20", "brian2>=2.10; python_version >= '3.12'"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
markers = ["integration: crosses module or process boundaries", "brian2: independent Brian2 comparisons", "accelerator: accelerator execution", "slow: substantial runtime", "regression: retained-artifact comparisons"]
filterwarnings = ["ignore:`torch.jit.script_method` is deprecated:DeprecationWarning", "ignore::pyparsing.exceptions.PyparsingDeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "E741"]

[tool.coverage.run]
source = ["snnlab.sim"]
omit = ["*/profiling.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
