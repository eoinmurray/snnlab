[project]
name = "snnlab"
dynamic = ["version"]
description = "Author, simulate and visualise spiking neural networks with conductance-based and current-based dynamics."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Eoin Murray" }]
dependencies = ["numpy>=2.2.6", "scipy>=1.15.3", "sympy>=1.14.0", "torch>=2.10.0", "torchvision>=0.25.0", "matplotlib>=3.10.8", "scikit-learn>=1.7.2", "h5py>=3.16.0"]

[project.urls]
Repository = "https://github.com/eoinmurray/snnlab"

[project.scripts]
snnsim = "snnlab.sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/snnlab"]

[tool.hatch.version]
path = "src/snnlab/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["/examples/excalidraw", "/examples/meanfield", "/examples/meanfield-delays", "/examples/diagrams", "/examples/snnlang", "/benchmarks", "/examples/native-training", "/examples/current-lif", "/examples/animated-neuron", "/examples/neurons", "/examples/hodgkin-huxley", "/examples/graded-synapses", "/examples/quickstart", "/examples/training", "/examples/inference", "/examples/streaming", "/examples/pytorch", "/examples/customisation", "/src", "/tests", "/docs", "/README.md", "/CHANGELOG.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]
exclude = ["/examples/meanfield-delays/results/switched.json", "/examples/meanfield-delays/results/uncoupled.json", "/examples/native-training/results/*.npz", "/examples/native-training/results/*.checkpoint", "/examples/native-training/results/network.bundle", "/examples/native-training/results/results.json", "/examples/customisation/results/network.bundle", "/examples/pytorch/results/trained.pt", "/examples/pytorch/results/metrics.json", "/examples/inference/results/predictions.json", "/examples/training/results/network.bundle", "/examples/training/results/trained.checkpoint", "/examples/training/results/metrics.json", "/docs/node_modules", "/docs/.next", "/docs/.source", "/docs/.astro", "/docs/out", "/docs/.wrangler", "/docs/.env*", "/docs/next-env.d.ts", "**/__pycache__", "**/*.pyc", "**/*.tsbuildinfo", "**/.DS_Store"]

[dependency-groups]
dev = [
    "pytest>=9.0.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "brian2>=2.10; python_version >= '3.12'",
    "snntorch>=0.9.4,<1.1",
    "pre-commit>=4.3,<5",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]
markers = ["integration: crosses module or process boundaries", "brian2: independent Brian2 comparisons", "snntorch: independent snnTorch comparisons", "accelerator: accelerator execution", "slow: substantial runtime", "regression: retained-artifact comparisons"]
filterwarnings = ["ignore:`torch.jit.script_method` is deprecated:DeprecationWarning", "ignore::pyparsing.exceptions.PyparsingDeprecationWarning"]

[tool.ruff]
target-version = "py310"
line-length = 88
include = ["*.py", "*.pyi", "*.ipynb"]
# Retained benchmark sources and numerical fixtures authenticate historical evidence.
extend-exclude = ["benchmarks/*/results", "docs/public/shd-benchmark", "tests/sim/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "SIM", "C4", "RET", "B", "C901", "PIE"]
ignore = ["E501", "E741", "C408"]
# Keep scientific E/I names and readable dict(key=value, ...) configurations.

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
# Short signatures stay compact; wrapped signatures use one parameter per line.
skip-magic-trailing-comma = false
quote-style = "double"
indent-style = "space"

[tool.coverage.run]
source = ["snnlab.sim"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
