repos:
  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff lint
        entry: uv run --locked ruff check --force-exclude
        language: system
        types_or: [python, pyi]
      - id: ruff-format
        name: Ruff formatting
        entry: uv run --locked ruff format --check --force-exclude
        language: system
        types_or: [python, pyi]
