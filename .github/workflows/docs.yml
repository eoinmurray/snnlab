name: Deploy documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'examples/**', 'CHANGELOG.md', 'src/snnlab/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'examples/**', 'CHANGELOG.md', 'src/snnlab/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: bun install --frozen-lockfile
      - run: bun run types:check
      - run: bun run build
        env:
          SITE_BASE_PATH: /snnlab
          SITE_URL: https://eoinmurray.github.io/snnlab/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
