name: Deploy documentation

on:
  push:
    branches: [main]
    paths: ['docs/**', 'src/snnlab/**', 'examples/**', '.github/workflows/docs.yml']
  pull_request:
    paths: ['docs/**', 'src/snnlab/**', 'examples/**', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check API reference coverage
        run: python3 scripts/generate_api.py --check
      - name: Check example pages and downloads
        run: python3 scripts/generate_examples.py --check
      - run: npm ci
      - run: npm run types:check
      - run: npm run build
        env:
          SITE_BASE_PATH: /snnlab
          SITE_URL: https://eoinmurray.github.io/snnlab/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
