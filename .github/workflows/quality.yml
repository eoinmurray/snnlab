name: Package checks
on:
  schedule:
    - cron: '17 3 * * *'
      timezone: Europe/London
  workflow_call:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install --yes graphviz ffmpeg
      - run: uv sync --dev --python 3.12
      - name: Check release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run python - <<'PYTHON'
          import os
          import runpy
          import sys

          version = runpy.run_path("src/snnlab/__init__.py")["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              sys.exit(f"Expected tag v{version}, got {tag}")
          PYTHON
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: uv run ruff check .
      - name: Run tests
        if: github.event_name == 'schedule'
        run: uv run pytest -q
        env:
          OMP_NUM_THREADS: "1"
          MPLBACKEND: Agg
      - run: uv build
