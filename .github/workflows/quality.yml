name: Package checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install --yes graphviz ffmpeg
      - run: uv sync --dev --python 3.12
      - name: Check release version metadata
        run: uv run python scripts/version.py check
      - name: Check release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: uv run python scripts/version.py check --tag "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: uv run ruff check .
      - run: uv run pytest -q -m "not slow"
        env:
          PINGLAB_NO_COMPILE: "1"
          OMP_NUM_THREADS: "1"
          MPLBACKEND: Agg
      - name: Run documentation examples
        run: uv run python docs/scripts/check_examples.py
        env:
          MPLBACKEND: Agg
          OMP_NUM_THREADS: '1'
      - run: uv build
