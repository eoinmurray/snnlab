name: Package checks
on:
  push:
  pull_request:
  workflow_call:
    inputs:
      skip_tests:
        description: Skip tests only when explicitly requested by the caller.
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install --yes graphviz ffmpeg
      - run: uv sync --dev --python 3.12
      - name: Check release tag matches the package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          uv run python - <<'PYTHON'
          import os
          import runpy
          import sys

          version = runpy.run_path("src/snnlab/__init__.py")["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}":
              sys.exit(f"Expected tag v{version}, got {tag}")
          PYTHON
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: uv run ruff check .
      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: uv run pytest -q -m "not slow"
        env:
          OMP_NUM_THREADS: "1"
          MPLBACKEND: Agg
      - run: uv build
