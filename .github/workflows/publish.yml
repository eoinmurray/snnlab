name: Publish snnlab to PyPI

# Like demolab: a version-source change on main publishes the package, then
# creates v<VERSION>. Manual dispatch can retry or backfill the current version.
# Register eoinmurray/snnlab, publish.yml, environment pypi as a PyPI Trusted
# Publisher for snnlab before the first release. No API token is required.
on:
  push:
    branches: [main]
    paths: ["src/snnlab/__init__.py"]
  workflow_dispatch:
    inputs:
      skip_tests:
        description: Publish without rerunning tests (explicit release request only).
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  checks:
    if: github.repository == 'eoinmurray/snnlab' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/quality.yml
    with:
      skip_tests: ${{ github.event_name == 'workflow_dispatch' && inputs.skip_tests }}

  publish:
    needs: checks
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'

      - name: Read and validate the package version
        id: version
        run: |
          uv run --no-project --python 3.12 python - <<'PYTHON'
          import os
          import re
          import runpy
          import sys

          version = runpy.run_path("src/snnlab/__init__.py")["__version__"]
          if not isinstance(version, str) or not re.fullmatch(r"(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)", version):
              sys.exit("Expected a MAJOR.MINOR.PATCH package version")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\n")
          PYTHON

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

      - name: Tag the release
        env:
          TAG: v${{ steps.version.outputs.version }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "$TAG already exists on origin — skipping tag."
          else
            git tag "$TAG"
            git push origin "$TAG"
          fi
